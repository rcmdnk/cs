---
name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: install zsh
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: pre-commit
        if: runner.os == 'Linux'
        run: |
          pip install pre-commit
          pre-commit run --all-files

      - name: Run tests
        run: |
          ./tests/run_tests.sh
